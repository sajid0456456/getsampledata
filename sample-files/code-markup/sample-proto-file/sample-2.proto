syntax = "proto3";

message Widget {
  int32 id = 1;
  string name = 2;
  float price = 3;
  string field0 = 10;
  string field1 = 11;
  string field2 = 12;
  string field3 = 13;
  string field4 = 14;
  string field5 = 15;
  string field6 = 16;
  string field7 = 17;
  string field8 = 18;
  string field9 = 19;
  string field10 = 20;
  string field11 = 21;
  string field12 = 22;
  string field13 = 23;
  string field14 = 24;
}
